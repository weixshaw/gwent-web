<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>组牌器 · 昆特牌 GWENT</title>
  <meta name="description" content="昆特牌组牌器独立验收页（真实数据）" />
  <link rel="stylesheet" href="../src/styles/theme.css" />
  <link rel="stylesheet" href="../src/styles/deckbuilder.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d0b09'/%3E%3Cpath d='M32 6l6 14 15 2-11 11 3 15-13-8-13 8 3-15L11 22l15-2z' fill='%23c9a227'/%3E%3C/svg%3E" />
  <style>
    /* 仅 demo 页使用的调试外壳，不属于组牌器样式 */
    .demo-backdrop {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(60% 60% at 50% 42%, #17120d 0%, #070605 72%);
      color: #8f8570;
      font-family: "Avenir Next", "PingFang SC", system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-align: center;
    }
    .demo-backdrop[hidden] { display: none; }
    .demo-backdrop strong {
      display: block;
      font-family: "Palatino Linotype", "Songti SC", serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: #f0d078;
    }
    .demo-reopen {
      padding: 10px 26px;
      border: 1px solid rgba(201, 162, 39, 0.55);
      border-radius: 4px;
      background: linear-gradient(180deg, #f2d789 0%, #c9a227 55%, #8a6f22 100%);
      color: #1a130a;
      font: 700 13px/1 "Avenir Next", "PingFang SC", system-ui, sans-serif;
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      cursor: pointer;
    }
    .demo-note { font-size: 11px; color: #6f6757; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div id="app">
    <div id="screen-root"></div>
    <div id="demo-backdrop" class="demo-backdrop" hidden>
      <strong>组牌器已关闭</strong>
      <p>demo 页已触发 onBack()（主菜单切换由 Lead 的 app.js 负责）。</p>
      <button type="button" id="demo-reopen" class="demo-reopen">重新打开组牌器</button>
      <p class="demo-note">onPlay 会通过 console.log + alert 展示对局配置。</p>
    </div>
  </div>

  <script type="module">
    import { createDeckBuilder } from "../src/ui/deckbuilder.js";

    const root = document.getElementById("screen-root");
    const backdrop = document.getElementById("demo-backdrop");

    const builder = createDeckBuilder({
      onPlay(config) {
        console.log("[deckbuilder demo] onPlay", config);
        try {
          alert("开始对局 · 配置\n" + JSON.stringify(config, null, 2));
        } catch (_err) {
          /* 自动化环境屏蔽 alert 时忽略 */
        }
      },
      onBack() {
        console.log("[deckbuilder demo] onBack");
        backdrop.hidden = false;
      },
    });

    root.appendChild(builder.el);
    builder.open();

    document.getElementById("demo-reopen").addEventListener("click", () => {
      backdrop.hidden = true;
      builder.open();
    });

    // 便于人工/自动化验收
    window.__deckbuilder = builder;
  </script>
</body>
</html>
